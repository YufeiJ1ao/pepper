<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2e9"><title>Pepper 睡觉中 · do not disturb</title><meta name="description" content="毛茸茸的 Pepper，在自己的小天地里呼呼大睡。"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#393d31;font-family:ui-rounded,'PingFang SC','Microsoft YaHei',sans-serif;transition:background 1s,color 1s}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #739477;outline-offset:5px}.page{min-height:100svh;max-width:1400px;margin:auto;padding:32px 6vw 22px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700;letter-spacing:1px;font-size:15px}.brand span{font-size:22px;margin-right:8px}.toggle{background:transparent;border:1px solid #cfd1c2;border-radius:50%;width:44px;height:44px;font-size:20px}.intro{text-align:center;margin:42px 0 0}.eyebrow{font-size:11px;letter-spacing:4px;color:#899079}.intro h1{font-size:clamp(32px,5vw,54px);font-weight:600;letter-spacing:3px;margin:15px 0 12px}.intro p{font-size:14px;color:#828672;letter-spacing:1px}.scene{position:relative;width:min(690px,100%);margin:0 auto;flex:1;min-height:330px;display:flex;align-items:center;justify-content:center}.scene svg{width:100%;overflow:visible}.dog{transform-origin:370px 300px;animation:breathe 4s ease-in-out infinite}.tail{transform-origin:457px 279px}.petted .tail{animation:wag .22s ease-in-out 8 alternate}.head{transform-origin:255px 303px}.petted .head{animation:nuzzle .7s ease-in-out 2}.blanket{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}.covered .blanket{opacity:1;transform:translateY(0)}.z{font:500 25px Georgia;fill:#929b7c;animation:zzz 4s infinite}.z2{animation-delay:1.3s}.z3{animation-delay:2.6s}.flower{transform-origin:560px 300px;animation:sway 7s ease-in-out infinite}.hint{position:absolute;bottom:10%;right:8%;font-size:12px;color:#91957f;transform:rotate(-7deg)}.petspot{cursor:pointer;outline:none}.petspot:focus-visible{filter:drop-shadow(0 0 6px #91aa79)}.status{text-align:center;font-size:13px;color:#7b8766;height:26px;letter-spacing:1px}.status:before{content:'';display:inline-block;width:6px;height:6px;background:#93a775;border-radius:50%;margin-right:8px}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0 24px}.pill{border:1px solid #d9dacc;background:#faf8f2;color:#59614d;padding:14px 22px;border-radius:18px;transition:transform .2s,background .3s}.pill:hover{transform:translateY(-3px);background:#eaf0df}.pill[aria-pressed=true]{background:#dfe8d2;border-color:#a1b58b}.pill span{margin-right:8px}footer{display:flex;justify-content:space-between;font-size:10px;color:#949982;letter-spacing:1px;margin-top:auto;padding-top:16px}.heart{position:absolute;pointer-events:none;color:#d99897;font-size:25px;animation:love 1.8s forwards}.night{background:#252c32;color:#e7e4d6}.night .pill{background:#343e42;border-color:#4c5a59;color:#d4dcc9}.night .intro p,.night .eyebrow,.night footer,.night .hint{color:#a3ad9b}.night .rug{fill:#414f49}.night .rugline{stroke:#57665b}.night .floor{fill:#303b3d}.night .status{color:#b4c59d}.night .toggle{border-color:#55645c}.night .stars{opacity:1}.stars{opacity:0;transition:opacity 1s}.night .pill[aria-pressed=true]{background:#50614b}
@keyframes breathe{50%{transform:scale(1.015,1.025)}}@keyframes zzz{0%{opacity:0;transform:translate(0,8px)}30%{opacity:.8}100%{opacity:0;transform:translate(14px,-30px)}}@keyframes wag{to{transform:rotate(-12deg)}}@keyframes nuzzle{50%{transform:rotate(-3deg)}}@keyframes sway{50%{transform:rotate(4deg)}}@keyframes love{to{transform:translateY(-85px) rotate(12deg);opacity:0}}@media(min-height:850px){.intro{margin-top:70px}.scene{max-height:480px}.controls{margin-bottom:45px}}@media(max-width:500px){.page{padding:24px 22px 18px}.intro{margin-top:40px}.scene{min-height:290px}.hint{bottom:12%;right:3%}.pill{padding:13px 16px;font-size:13px}footer{font-size:9px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.raster-stage{position:relative;width:100%;aspect-ratio:1.65;isolation:isolate}.soft-rug{position:absolute;background:#dce4ca;border:2px dashed #c4cfb1;border-radius:50%;width:85%;height:36%;left:7%;top:51%;transform:rotate(-3deg);z-index:-1}.night .soft-rug{background:#414f49;border-color:#57665b}.raster-body{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;clip-path:polygon(0 0,75% 0,75% 64%,80% 64%,80% 100%,0 100%)}.raster-body img{position:absolute;width:100%;height:auto;left:0;top:0}.raster-tail{position:absolute;width:25%;height:40%;left:65%;top:32%;overflow:hidden;transform-origin:10% 60%;animation:tail-sleep 5s ease-in-out infinite;z-index:-1}.raster-tail img{position:absolute;width:400%;max-width:none;left:-300%;top:-85%;}.petted .raster-tail{animation:tail-happy .24s ease-in-out 8 alternate}.raster-petspot{position:absolute;left:6%;top:37%;width:28%;height:37%;border:0;border-radius:50%;background:transparent}.sleep-z{position:absolute;left:25%;top:15%;color:#8b9876;font:24px Georgia;letter-spacing:9px}.cozy-blanket{position:absolute;left:39%;top:46%;width:27%;height:26%;background:repeating-linear-gradient(90deg,#b8c798 0 12px,#b0c18e 12px 13px);border-left:8px solid #e6e8cb;border-radius:18% 30% 25% 12%;transform:rotate(8deg);opacity:0;transition:opacity .7s;pointer-events:none}.covered .cozy-blanket{opacity:1}.hint{bottom:5%}.scene{min-height:300px}.night .sleep-z{color:#b5c59e}@keyframes tail-sleep{0%,35%,75%,100%{transform:rotate(0deg)}45%,65%{transform:rotate(-9deg)}55%{transform:rotate(6deg)}}@keyframes tail-happy{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}@media(max-width:500px){.scene{min-height:250px}.raster-stage{width:115%;flex-shrink:0}.sleep-z{font-size:18px}.hint{bottom:6%}}
</style></head><body><main class="page"><header class="top"><div class="brand"><span>♧</span>Pepper 的小日子</div><button class="toggle" id="night" aria-label="切换夜晚" aria-pressed="false">☾</button></header><div class="intro"><div class="eyebrow">A LITTLE PAUSE, A LITTLE PAW.</div><h1>嘘，Pepper 睡着了。</h1><p>今天的任务：躺平，然后做一个好梦。</p></div><div class="scene" id="scene">
<div class="raster-stage" role="img" aria-label="长毛小黑狗 Pepper 侧躺着熟睡，尾巴轻轻摇动"><div class="soft-rug"></div><div class="raster-tail"><img src="sleepy-dog-sprites.png" alt=""></div><div class="raster-body"><img src="sleepy-dog-sprites.png" alt=""></div><div class="cozy-blanket"></div><button class="raster-petspot" id="petspot" aria-label="摸摸 Pepper 的头"></button><span class="sleep-z">z z Z</span></div><span class="hint">轻轻摸摸它 ↖</span></div><div class="status" id="status" aria-live="polite">正在梦里追小蝴蝶</div><div class="controls"><button class="pill" id="pet"><span>♡</span>摸摸头</button><button class="pill" id="blanket" aria-pressed="false"><span>▧</span><b style="font-weight:400">盖好小被子</b></button><button class="pill" id="sound" aria-pressed="false"><span>♫</span><b style="font-weight:400">听点晚安音乐</b></button></div><footer><span>NOTHING TO DO. JUST BEING A DOG.</span><span>好梦，Pepper ♡</span></footer></main><script>
const scene=document.getElementById('scene'),status=document.getElementById('status');let petTimer,statusTimer;function say(t){status.textContent=t;clearTimeout(statusTimer);statusTimer=setTimeout(()=>status.textContent=scene.classList.contains('covered')?'被子暖暖的，梦也暖暖的':'正在梦里追小蝴蝶',4200)}function pet(){scene.classList.remove('petted');void scene.offsetWidth;scene.classList.add('petted');say('嗯哼… 喜欢你摸摸，尾巴藏不住了');clearTimeout(petTimer);petTimer=setTimeout(()=>scene.classList.remove('petted'),2000);for(let i=0;i<3;i++){const h=document.createElement('span');h.className='heart';h.textContent='♡';h.style.left=(30+Math.random()*15)+'%';h.style.top=(52+Math.random()*8)+'%';h.style.animationDelay=i*.13+'s';scene.appendChild(h);setTimeout(()=>h.remove(),2300)}}document.getElementById('pet').onclick=pet;document.getElementById('petspot').onclick=pet;document.getElementById('petspot').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pet()}};document.getElementById('blanket').onclick=function(){const on=scene.classList.toggle('covered');this.setAttribute('aria-pressed',on);this.querySelector('b').textContent=on?'掀开小被子':'盖好小被子';say(on?'被子暖暖的，梦也暖暖的':'伸个懒腰，继续呼呼')};document.getElementById('night').onclick=function(){const on=document.body.classList.toggle('night');this.textContent=on?'☀':'☾';this.setAttribute('aria-pressed',on);this.setAttribute('aria-label',on?'切换白天':'切换夜晚');say(on?'月亮值班，Pepper 晚安':'阳光晒着肚皮，再睡五分钟')};let ctx,musicTimer,playing=false,step=0;const melody=[523.25,659.25,783.99,659.25,587.33,659.25,523.25,0,440,523.25,659.25,523.25,493.88,392,523.25,0];function note(){if(!playing)return;const f=melody[step++%melody.length];if(!f)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.045,ctx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+1.7);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+1.8)}document.getElementById('sound').onclick=async function(){if(playing){playing=false;clearInterval(musicTimer);await ctx.suspend()}else{try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();playing=true;note();musicTimer=setInterval(note,650)}catch(e){say('音乐暂时没能响起，先陪小狗安静一会儿');return}}this.setAttribute('aria-pressed',playing);this.querySelector('b').textContent=playing?'关掉晚安音乐':'听点晚安音乐';say(playing?'叮叮咚咚，做个软软的梦':'安安静静，听见 Pepper 的好梦')};document.addEventListener('visibilitychange',()=>{if(ctx&&playing){if(document.hidden)ctx.suspend();else ctx.resume()}});
</script></body></html>
